<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiFresh Market - Pay With Pi</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f6f4}
header{background:#0a7a42;color:#fff;padding:16px;text-align:center;position:sticky;top:0}
header h1{margin:0;font-size:24px}
header p{margin:5px 0 0;font-size:13px}
.search{padding:12px}
.search input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:0 12px}
.cats button{white-space:nowrap;border:1px solid #0a7a42;background:#fff;color:#0a7a42;padding:8px 14px;border-radius:20px}
.cats button.active{background:#0a7a42;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img{width:100%;height:110px;object-fit:cover;border-radius:10px}
.card h3{font-size:14px;margin:8px 0 2px}
.card p{margin:2px 0;color:#666;font-size:12px}
.price{color:#0a7a42;font-weight:bold!important;font-size:15px!important}
.card button{width:100%;background:#0a7a42;color:#fff;border:0;padding:10px;border-radius:8px;margin-top:6px}
.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center}
.cartbar button{background:#ffcc00;border:0;padding:10px 16px;border-radius:8px;font-weight:bold}
.info{padding:12px 12px 90px;text-align:center;color:#555;font-size:13px}
</style>
</head>
<body>
<header><h1>🥬 PiFresh Market</h1><p>Your Everyday Market • Pay With Pi • Warri, Nigeria</p></header>
<div class="search"><input id="search" placeholder="Search rice, yam, phone, shoes..." oninput="render()"></div>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div class="info">✅ Verified Sellers • 🚚 Fast Delivery in Warri • 💜 Pay With Pi or Cash<br><br><b>How to Order:</b> Press Add to Cart, then Checkout on WhatsApp.</div>
<div class="cartbar"><span id="cartText">🛒 Cart: 0 items • ₦0</span><button onclick="checkout()">Checkout</button></div>
<script>
const products=[
{name:"Bag of Rice (50kg)",cat:"Food",price:85000,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
{name:"Fresh Yam (5 Tubers)",cat:"Food",price:12000,img:"https://images.unsplash.com/photo-1596097635121-14b63b7a0c19?w=400"},
{name:"Fresh Tomatoes Basket",cat:"Food",price:8000,img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=400"},
{name:"Palm Oil (5 Litres)",cat:"Food",price:15000,img:"https://images.unsplash.com/photo-1601049676869-702ea24cfd58?w=400"},
{name:"iPhone 13 (UK Used)",cat:"Gadgets",price:385000,img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400"},
{name:"Samsung A15",cat:"Gadgets",price:215000,img:"https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400"},
{name:"AirPods Pro",cat:"Gadgets",price:45000,img:"https://images.unsplash.com/photo-1600294037681-c80b4cb5b434?w=400"},
{name:"Men's Sneakers",cat:"Fashion",price:28000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"},
{name:"Ladies Handbag",cat:"Fashion",price:18000,img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=400"},
{name:"Ankara Gown",cat:"Fashion",price:32000,img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400"},
{name:"Standing Fan",cat:"Home",price:42000,img:"https://images.unsplash.com/photo-1565151443833-29bf49b1e5f6?w=400"},
{name:"Rice Cooker",cat:"Home",price:35000,img:"https://images.unsplash.com/photo-1585515320310-259814833e62?w=400"},
];
let cats=["All","Food","Gadgets","Fashion","Home"]; let active="All"; let cart=[];
document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${c==active?'active':''}" onclick="setCat('${c}')">${c}</button>`).join("");
function setCat(c){active=c; document.querySelectorAll(".cats button").forEach((b,i)=>b.className=cats[i]==c?"active":""); render();}
function render(){
 let q=document.getElementById("search").value.toLowerCase();
 let list=products.filter(p=>(active=="All"||p.cat==active)&&p.name.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.map((p,i)=>`<div class="card"><img src="${p.img}"><h3>${p.name}</h3><p>${p.cat} • Verified Seller</p><p class="price">₦${p.price.toLocaleString()}</p><button onclick="add(${products.indexOf(p)})">Add to Cart</button></div>`).join("");
}
function add(i){cart.push(products[i]); update();}
function update(){let total=cart.reduce((s,p)=>s+p.price,0); document.getElementById("cartText").textContent=`🛒 Cart: ${cart.length} items • ₦${total.toLocaleString()}`;}
function checkout(){
 if(cart.length==0){alert("Your cart is empty. Add something first.");return;}
 let total=cart.reduce((s,p)=>s+p.price,0);
 let msg="Hello PiFresh Market! I want to order:%0A"+cart.map(p=>"• "+p.name+" - ₦"+p.price.toLocaleString()).join("%0A")+"%0A%0ATotal: ₦"+total.toLocaleString()+"%0A%0AI want to pay with Pi / Cash.";
 window.open("https://wa.me/2340000000000?text="+msg,"_blank");
}
render();
</script>
</body>
</html>
